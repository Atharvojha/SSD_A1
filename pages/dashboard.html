<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Portal - Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
  <script>var SP_LOGIN_PATH = "../index.html";</script>
  <script src="../js/guard.js"></script>
</head>
<body>
  <div id="wrapper">
    <div id="header">
      <h2>Welcome back, Student</h2>
      <a href="../index.html" class="logout-link">Logout</a>
    </div>

    <div id="nav">
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="academics/courses.html">Courses</a></li>
        <li><a href="academics/grades.html">Grades</a></li>
        <li><a href="profile.html">Profile</a></li>
      </ul>
    </div>

    <div id="content">
      <div id="statCards">
        <div class="stat-card">
          <span class="stat-value" id="statCredits">7</span>
          <span class="stat-label">Credits Completed</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="statCourses">2</span>
          <span class="stat-label">Active Courses</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="statGPA">--</span>
          <span class="stat-label">GPA</span>
        </div>
      </div>

      <table border="1" cellpadding="5" cellspacing="0" id="summaryTable">
        <tr><th>Course</th><th>Grade</th></tr>
        <tr data-grade="A" data-credits="3"><td>Intro to Programming</td><td>A</td></tr>
        <tr data-grade="B+" data-credits="4"><td>Data Structures</td><td>B+</td></tr>
      </table>
    </div>
  </div>

  <script src="../js/dashboard.js"></script>
</body>
</html>
