<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Portal - Profile</title>
  <link rel="stylesheet" href="../css/style.css">
  <script>var SP_LOGIN_PATH = "../index.html";</script>
  <script src="../js/guard.js"></script>
  <script src="../js/theme.js"></script>
</head>
<body>
  <div id="wrapper">
    <div id="header">
      <h2>My Profile</h2>
      <a href="../index.html" class="logout-link">Logout</a>
    </div>

    <div id="nav">
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="academics/courses.html">Courses</a></li>
        <li><a href="academics/grades.html">Grades</a></li>
        <li><a href="profile.html">Profile</a></li>
      </ul>
    </div>

    <div id="content">
      <table border="1" cellpadding="5" cellspacing="0" id="profileTable">
        <tr><th>Full Name</th><td id="profileName"></td></tr>
        <tr><th>Student ID</th><td id="profileId"></td></tr>
        <tr><th>Email</th><td id="profileEmail"></td></tr>
        <tr><th>Major</th><td id="profileMajor"></td></tr>
      </table>

      <h3>Edit Profile</h3>
      <form id="profileForm">
        <label for="editName">Full Name</label>
        <input type="text" id="editName" name="editName">

        <label for="editEmail">Email</label>
        <input type="text" id="editEmail" name="editEmail">

        <label for="editMajor">Major</label>
        <input type="text" id="editMajor" name="editMajor">

        <input type="submit" value="Save Changes" id="saveProfileBtn">
        <p id="profileError" style="color:red;display:none;"></p>
        <p id="profileSuccess" style="color:green;display:none;">Profile updated successfully.</p>
      </form>
    </div>
  </div>

  <script src="../js/profile.js"></script>
</body>
</html>
